<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404页面未找到 - 传奇发布网站</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css">
<style>
.error-page { text-align: center; padding: 80px 20px; }
.error-page h1 { font-size: 72px; color: #c00; margin-bottom: 20px; }
.error-page p { font-size: 18px; color: #666; margin-bottom: 30px; }
.error-page .btn { display: inline-block; padding: 12px 30px; background: #c00; color: #fff; border-radius: 3px; font-size: 16px; }
.error-page .btn:hover { background: #a00; color: #fff; }
</style>
</head>
<body>
<div class="container">
    <div class="error-page">
        <h1>404</h1>
        <p>抱歉，您访问的页面不存在或已被删除</p>
        <a href="index.html" class="btn">返回首页</a>
    </div>
</div>
</body>
</html>
